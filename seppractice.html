<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Webpage</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      text-align: center;
    }

    header {
      background-color: #007bff;
      color: white;
      padding: 30px;
    }

    main {
      padding: 50px 20px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #6eb300;
    }

    footer {
      background-color: #222;
      color: white;
      padding: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>A simple webpage made with HTML and CSS</p>
  </header>

  <main>
    <h2>Hello World!</h2>
    <p>This is my first simple webpage.</p>
    <button>Click Me</button>
  </main>

  <footer>
    <p>&copy; 2026 My Website</p>
  </footer>

</body>
</html>
