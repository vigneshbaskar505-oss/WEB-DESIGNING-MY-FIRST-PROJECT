<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3 Image Carousel</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }

  .carousel {
    width: 600px; /* 3 images × 200px */
    overflow: hidden;
    margin: 50px auto;
    position: relative;
  }

  .carousel-track {
    display: flex;
    transition: transform 0.5s ease-in-out;
  }

  .carousel img {
    width: 200px;
    height: 150px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .buttons {
    text-align: center;
    margin-top: 10px;
  }

  button {
    padding: 8px 12px;
    margin: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="carousel">
  <div class="carousel-track" id="track">
    <img src="https://via.placeholder.com/200x150?text=1">
    <img src="https://via.placeholder.com/200x150?text=2">
    <img src="https://via.placeholder.com/200x150?text=3">
    <img src="https://via.placeholder.com/200x150?text=4">
    <img src="https://via.placeholder.com/200x150?text=5">
    <img src="https://via.placeholder.com/200x150?text=6">
  </div>
</div>

<div class="buttons">
  <button onclick="moveSlide(-1)">Prev</button>
  <button onclick="moveSlide(1)">Next</button>
</div>

<script>
  let index = 0;
  const track = document.getElementById('track');
  const totalSlides = 6;
  const visibleSlides = 4;
  const slideWidth = 200;

  function moveSlide(direction) {
    index += direction;

    // prevent over-scrolling
    if (index < 0) index = 0;
    if (index > totalSlides - visibleSlides) {
      index = totalSlides - visibleSlides;
    }

    track.style.transform = `translateX(-${index * slideWidth}px)`;
  }
</script>

</body>
</html>
