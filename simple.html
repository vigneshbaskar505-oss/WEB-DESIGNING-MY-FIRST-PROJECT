<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        .parent{
            border: 2px solid red;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .child{
            /* width: 150px; */
            flex-basis: 12%;  
            /* 6 box - 1 row */
            height: 150px;
            background-color: blueviolet;
            margin: 15px;
        }


        @media screen and (max-width:1000px){
           .child{
            /* 3 box - 1 row */
            flex-basis: 25%;
            height: 150px;
            background-color: blueviolet;
            margin: 15px;
           } 
        }


        @media  screen and (max-width:800px) {

            .child{
                /* 2 box - 1 row */
                flex-basis: 35%;
            height: 150px;
            background-color: blueviolet;
            margin: 15px;
                

            }
            
        }

        @media screen and (max-width:650px){
            /* 1 box - 1 row */
             .child{
                flex-basis: 70%;
            height: 150px;
            background-color: blueviolet;
            margin: 15px;
             }
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>
</html>
